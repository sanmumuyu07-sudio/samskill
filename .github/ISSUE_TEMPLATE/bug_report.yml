name: Bug report
description: 报告可公开复现的错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿提交客户资料、密钥、真实联系方式或未授权原文。
  - type: input
    id: version
    attributes:
      label: Samskill 版本
      placeholder: 1.0.0-beta.3
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: 涉及的 Skill
      placeholder: sam-project-diagnosis
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 任务与最低输入
      description: 使用脱敏信息说明你让它完成什么。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布确认
      options:
        - label: 我已移除客户、隐私、密钥和未授权材料。
          required: true
